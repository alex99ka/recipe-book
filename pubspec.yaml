name: recipe_book
description: "ספר מתכונים: the recipe book app, on the make-an-app core."
publish_to: 'none'
version: 5.17.2

environment:
  sdk: ^3.13.3

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  firebase_auth: 6.7.0
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.2
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/licenses/
  fonts:
    # Hebrew sans, bundled (works offline, no runtime font fetch). OFL:
    # assets/fonts/Rubik-OFL.txt.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    # Noto Sans supplies Latin and Cyrillic; the Hebrew companion fills its
    # script gap. Same pairing for Noto Serif. Both font families are OFL.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansHebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
    - family: NotoSerifHebrew
      fonts:
        - asset: assets/fonts/NotoSerifHebrew.ttf
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo.ttf
    - family: Assistant
      fonts:
        - asset: assets/fonts/Assistant.ttf
    - family: Alef
      fonts:
        - asset: assets/fonts/Alef.ttf
    - family: FrankRuhlLibre
      fonts:
        - asset: assets/fonts/FrankRuhlLibre.ttf
    - family: DavidLibre
      fonts:
        - asset: assets/fonts/DavidLibre.ttf
    - family: SecularOne
      fonts:
        - asset: assets/fonts/SecularOne.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf

# The Ionic app's book-and-steam art; its orange background repainted in the
# brand light brown (icon.png), and the book alone for the adaptive icon.
flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  adaptive_icon_background: "#B08463"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#B08463"
    theme_color: "#B08463"
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256

# The native splash: the cream (or dark) background with the icon, as the app opens.
flutter_native_splash:
  color: "#FAF6F1"
  color_dark: "#17130F"
  image: assets/icon_foreground.png
  android_12:
    color: "#FAF6F1"
    color_dark: "#17130F"
    image: assets/icon_foreground.png
    icon_background_color: "#B08463"
    icon_background_color_dark: "#B08463"
  web: false
